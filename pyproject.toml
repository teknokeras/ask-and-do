[project]
name = "ask-and-do"
version = "0.0.1"
description = "Reference implementation of a docs assistant that answers with citations and performs allowlisted API actions."
readme = "README.md"
license = "MIT"
requires-python = "==3.12.*"
dependencies = [
    "fastembed==0.9.1",
    "httpx==0.28.1",
    "pgvector==0.5.1",
    "psycopg[binary]==3.3.7",
    "pydantic-settings==2.16.2",
    "trafilatura==2.3.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["common", "prepare", "runtime"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
