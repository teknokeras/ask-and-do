name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Same image as docker-compose.yml. The password only exists inside this job.
      db:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: askanddo
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: askanddo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U askanddo -d askanddo"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://askanddo:ci-only@localhost:5432/askanddo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
